name: Build VenomSense APK
on:
  push:
    branches: [ "main", "release/**" ]
    paths-ignore: [ '**.md', '.github/workflows/setup-signing.yml' ]
  workflow_dispatch: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    name: Build VenomSense APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Restore Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-
      - name: Restore or generate signing keystore
        run: |
          cd "VenomSense App"
          mkdir -p signing
          if [ -f signing/signing-key.jks ]; then
            echo "Using committed keystore"
          else
            echo "Generating fallback keystore for CI"
            keytool -genkeypair -v -keystore signing/signing-key.jks -storetype PKCS12 -storepass venom123 -keypass venom123 -alias venomsense -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=VenomSense, OU=Mobile, O=VenomSense, L=India, ST=Odisha, C=IN"
          fi
      - name: Create local.properties
        run: |
          cd "VenomSense App"
          printf 'signing.storeFile=signing/signing-key.jks\nsigning.storePassword=venom123\nsigning.keyAlias=venomsense\nsigning.keyPassword=venom123\n' > local.properties
      - name: Download Gradlew
        run: |
          cd "VenomSense App"
          curl -sLO https://raw.githubusercontent.com/gradle/gradle/master/gradlew
          chmod +x ./gradlew
      - name: Bump version
        run: |
          cd "VenomSense App"
          BUILD=${{ github.run_number }}
          VER_NAME="1.0.${BUILD}"
          sed -i "s/versionCode = [0-9]*/versionCode = ${BUILD}/" app/build.gradle.kts
          sed -i "s/versionName = \"[^\"]*\"/versionName = \"${VER_NAME}\"/" app/build.gradle.kts
      - name: Assemble Release APK
        run: |
          cd "VenomSense App"
          set -o pipefail
          ./gradlew :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
      - name: Get version info
        id: version
        run: |
          cd "VenomSense App"
          VER=$(grep 'versionName' app/build.gradle.kts | grep -oP '"[^"]+"' | tr -d '"' | head -1)
          echo "name=$VER" >> $GITHUB_OUTPUT
      - name: Rename APKs
        run: |
          cd "VenomSense App"
          VER="${{ steps.version.outputs.name }}"
          OUTDIR="app/build/outputs/apk/release"
          declare -A ABI_LABELS=( ["universal"]="universal-all-devices" ["armeabi-v7a"]="armv7-watch-32bit" ["arm64-v8a"]="arm64-phone-64bit" ["x86_64"]="x86_64-emulator" )
          # Just rename the generic app-release.apk if splits aren't enabled
          if [ -f "$OUTDIR/app-release.apk" ]; then
            mv "$OUTDIR/app-release.apk" "$OUTDIR/VenomSense-v${VER}.apk"
          fi
          for ABI in "${!ABI_LABELS[@]}"; do
            SRC="$OUTDIR/app-${ABI}-release.apk"
            if [ -f "$SRC" ]; then
              DEST="$OUTDIR/VenomSense-v${VER}-${ABI_LABELS[$ABI]}.apk"
              mv "$SRC" "$DEST"
            fi
          done
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: VenomSense-v${{ steps.version.outputs.name }}-all-apks
          path: VenomSense App/app/build/outputs/apk/release/VenomSense-*.apk
          retention-days: 1
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}-build.${{ github.run_number }}
          name: "VenomSense v${{ steps.version.outputs.name }}"
          body: |
            ## VenomSense v${{ steps.version.outputs.name }}
            **Branch:** `${{ github.ref_name }}` | **Commit:** `${{ github.sha }}`
            
            - **Embedded UI** — The full glassmorphism Web App is bundled securely inside the app.
            - **Local HTTP Proxy** — Hosts the UI via native WebViewAssetLoader.
            - **Real-time Hardware Sync** — Includes instantaneous updates and background synchronization.
          draft: false
          prerelease: false
          files: VenomSense App/app/build/outputs/apk/release/VenomSense-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
