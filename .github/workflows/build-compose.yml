name: Build VenomSense Native Compose APK
on:
  push:
    branches: [ "main", "release/**" ]
    paths:
      - 'VenomSense-Android/**'
      - '.github/workflows/build-compose.yml'
  workflow_dispatch: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    name: Build Compose APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Download Gradlew
        run: |
          cd "VenomSense-Android"
          curl -sLO https://raw.githubusercontent.com/gradle/gradle/master/gradlew
          chmod +x ./gradlew
          mkdir -p gradle/wrapper
          curl -sL https://raw.githubusercontent.com/gradle/gradle/master/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
      - name: Bump version
        run: |
          cd "VenomSense-Android"
          BUILD=${{ github.run_number }}
          VER_NAME="1.0"
          sed -i "s/versionCode = [0-9]*/versionCode = ${BUILD}/" app/build.gradle.kts
      - name: Assemble Release APK
        run: |
          cd "VenomSense-Android"
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Rename APKs
        run: |
          cd "VenomSense-Android"
          OUTDIR="app/build/outputs/apk/release"
          if [ -f "$OUTDIR/app-release.apk" ]; then
            mv "$OUTDIR/app-release.apk" "$OUTDIR/VenomSense-Native-1.0-universal.apk"
          fi
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: compose-v1.0-build.${{ github.run_number }}
          name: "VenomSense Native Compose v1.0"
          body: "Pure Kotlin Jetpack Compose 1:1 Replica!"
          draft: false
          prerelease: false
          files: VenomSense-Android/app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
