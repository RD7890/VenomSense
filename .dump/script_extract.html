<script>
// =============================================
//  VenomSense — Companion Web App
// =============================================

// --- State ---
let ws = null;
let isConnected = false;
let demoMode = false;
let demoInterval = null;
let autoConnect = true;
let reconnectTimer = null;
let isLightTheme = false;
let scanHistory = [];

// --- DOM References ---
const $ = id => document.getElementById(id);
const connBadge     = $('connBadge');
const connText      = $('connText');
const gaugeValue    = $('gaugeValue');
const gaugeFill     = $('gaugeFill');
const statusBadge   = $('statusBadge');
const statusIcon    = $('statusIcon');
const statusText    = $('statusText');
const deepScanBtn   = $('deepScanBtn');
const infoHue       = $('infoHue');
const infoSat       = $('infoSat');
const infoRGB       = $('infoRGB');
const rgbBar        = $('rgbBar');
const infoClear     = $('infoClear');
const historyList   = $('historyList');
const emptyHistory  = $('emptyHistory');
const wsInput       = $('wsInput');
const connectBtn    = $('connectBtn');
const demoToggle    = $('demoToggle');
const themeToggle   = $('themeToggle');
const autoConnToggle = $('autoConnToggle');

// --- Constants ---
const ARC_LENGTH = 386; // 270-degree arc of r=82

// =============================================
//  SPLASH SCREEN
// =============================================
setTimeout(() => {
  const splash = $('splash');
  splash.classList.add('hiding');
  setTimeout(() => splash.style.display = 'none', 500);
}, 1800);

// =============================================
//  NAVIGATION
// =============================================
let currentNavIndex = 0;
const navItems = Array.from(document.querySelectorAll('.nav-item'));
const navIndicator = $('navIndicator');

function updateIndicator(item) {
  if(!item || !navIndicator) return;
  const itemRect = item.getBoundingClientRect();
  const navRect = item.parentElement.getBoundingClientRect();
  navIndicator.style.width = (itemRect.width - 10) + 'px';
  navIndicator.style.transform = `translateX(${itemRect.left - navRect.left + 5}px)`;
}

navItems.forEach((item, index) => {
  item.addEventListener('click', () => {
    if (currentNavIndex === index) return;
    const isForward = index > currentNavIndex;
    currentNavIndex = index;

    navItems.forEach(n => n.classList.remove('active'));
    item.classList.add('active');
    updateIndicator(item);

    document.querySelectorAll('.page').forEach(p => {
      p.classList.remove('active', 'slide-left', 'slide-right');
    });
    
    const targetPage = $(item.dataset.page);
    targetPage.classList.add('active');
    targetPage.classList.add(isForward ? 'slide-left' : 'slide-right');
  });
});

window.addEventListener('load', () => setTimeout(() => updateIndicator(document.querySelector('.nav-item.active')), 100));
window.addEventListener('resize', () => updateIndicator(document.querySelector('.nav-item.active')));

// =============================================
//  WEBSOCKET CONNECTION
// =============================================
function toggleConnection() {
  if (isConnected) {
    autoConnect = false; // Disable auto-connect if manually disconnected
    autoConnToggle.classList.remove('active');
    disconnect();
  } else {
    connect();
  }
}

function connect() {
  if (ws && (ws.readyState === WebSocket.CONNECTING || ws.readyState === WebSocket.OPEN)) return;
  
  const url = wsInput.value.trim();
  if (!url) { showToast('Enter a WebSocket address', 'warn'); return; }

  try {
    ws = new WebSocket(url);
  } catch (e) {
    if(!autoConnect) showToast('Invalid WebSocket URL', 'error');
    handleReconnect();
    return;
  }

  if(!autoConnect || !reconnectTimer) showToast('Connecting to device...', 'info');

  ws.onopen = () => {
    isConnected = true;
    if(reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
    updateConnectionUI(true);
    showToast('Connected to VenomSense', 'success');
    $('wsAddrDisplay').textContent = url;
  };

  ws.onmessage = (event) => {
    try {
      const data = JSON.parse(event.data);
      handleDeviceData(data);
    } catch (e) {
      console.error('Parse error:', e);
    }
  };

  ws.onclose = () => {
    if (isConnected) showToast('Device disconnected', 'error');
    isConnected = false;
    updateConnectionUI(false);
    ws = null;
    handleReconnect();
  };

  ws.onerror = () => {
    if(!autoConnect && !reconnectTimer) showToast('Connection failed', 'error');
    isConnected = false;
    updateConnectionUI(false);
    ws = null;
    handleReconnect();
  };
}

function disconnect() {
  if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
  if (ws) {
    ws.onclose = null; // Prevent reconnect trigger
    ws.onerror = null;
    ws.close();
    ws = null;
  }
  isConnected = false;
  updateConnectionUI(false);
  showToast('Disconnected', 'info');
}

function handleReconnect() {
  if (autoConnect && !demoMode && !isConnected) {
    if (reconnectTimer) clearTimeout(reconnectTimer);
    reconnectTimer = setTimeout(() => {
      connect();
    }, 3000);
  }
}

function toggleAutoConnect() {
  autoConnect = !autoConnect;
  autoConnToggle.classList.toggle('active', autoConnect);
  if (autoConnect && !isConnected && !demoMode) connect();
}

function toggleTheme() {
  isLightTheme = !isLightTheme;
  themeToggle.classList.toggle('active', isLightTheme);
  document.body.classList.toggle('light-theme', isLightTheme);
}

// Initial auto-connect
setTimeout(() => { if(autoConnect && !demoMode) connect(); }, 2000);


function updateConnectionUI(connected) {
  if (connected) {
    connBadge.className = 'connection-badge connected';
    connBadge.innerHTML = '<i class="fa-solid fa-link"></i><span>Connected</span>';
    connectBtn.textContent = 'Disconnect';
    connectBtn.className = 'action-btn danger';
    deepScanBtn.disabled = false;
    $('deviceInfoDesc').textContent = 'Connected';
    $('deviceInfo').style.display = 'block';
    $('diDevice').textContent = 'VenomSense';
    $('diStatus').textContent = 'Active';
    $('diPort').textContent = '81';
  } else {
    connBadge.className = 'connection-badge disconnected';
    connBadge.innerHTML = '<i class="fa-solid fa-link-slash"></i><span>Disconnected</span>';
    connectBtn.textContent = 'Connect';
    connectBtn.className = 'action-btn primary';
    if (!demoMode) deepScanBtn.disabled = true;
    $('deviceInfoDesc').textContent = 'Not connected';
    $('deviceInfo').style.display = 'none';
    updateStatusBadge('idle', 'NO DEVICE', 'fa-plug');
  }
}

// =============================================
//  DATA HANDLING
// =============================================
function handleDeviceData(data) {
  switch (data.type) {
    case 'connected':
      $('diDevice').textContent = data.device || 'VenomSense';
      break;

    case 'scan':
      updateDashboard(data);
      break;

    case 'deepScanStarted':
      openDeepScanModal();
      break;

    case 'deepScanProgress':
      updateDeepScanProgress(data.progress);
      break;

    case 'deepScanResult':
      showDeepScanResult(data);
      updateDashboard(data);
      addToHistory(data);
      break;
  }

  // Add normal danger scans to history (throttled)
  if (data.type === 'scan' && data.status === 'danger' && data.venom > 10) {
    throttleAddHistory(data);
  }
}

let lastHistoryAdd = 0;
function throttleAddHistory(data) {
  const now = Date.now();
  if (now - lastHistoryAdd > 3000) { // Max one entry every 3 seconds
    addToHistory(data);
    lastHistoryAdd = now;
  }
}

function updateDashboard(data) {
  const venom = data.venom || 0;
  const status = data.status || 'safe';

  // Gauge
  const offset = ARC_LENGTH - (ARC_LENGTH * Math.min(venom, 100) / 100);
  gaugeFill.style.strokeDashoffset = offset;
  gaugeValue.textContent = venom + '%';

  // Gauge color
  if (status === 'danger') {
    gaugeFill.style.stroke = 'var(--danger)';
    gaugeValue.style.color = 'var(--danger)';
  } else if (status === 'no_cartridge') {
    gaugeFill.style.stroke = 'var(--warning)';
    gaugeValue.style.color = 'var(--warning)';
  } else {
    gaugeFill.style.stroke = 'var(--safe)';
    gaugeValue.style.color = 'var(--safe)';
  }

  // Status badge
  if (status === 'no_cartridge') {
    updateStatusBadge('warning', 'INSERT CARTRIDGE', 'fa-triangle-exclamation');
  } else if (status === 'danger') {
    updateStatusBadge('danger', venom >= 50 ? 'HIGH TOXIN (BOLD)' : 'LOW TOXIN (FADED)', 'fa-biohazard');
  } else {
    updateStatusBadge('safe', 'SAFE — NO TOXIN', 'fa-shield');
  }

  // Info cards
  if (data.hue !== undefined) infoHue.textContent = parseFloat(data.hue).toFixed(1) + '°';
  if (data.saturation !== undefined) infoSat.textContent = (parseFloat(data.saturation) * 100).toFixed(1) + '%';
  if (data.raw) {
    infoRGB.textContent = data.raw.r + ' / ' + data.raw.g + ' / ' + data.raw.b;
    infoClear.textContent = data.raw.c + ' lx';
    updateRGBBar(data.raw.r, data.raw.g, data.raw.b);
  }

  // Update client count
  if (isConnected) $('diClients').textContent = '1+';
}

function updateStatusBadge(type, text, icon) {
  statusBadge.className = 'status-badge ' + type;
  statusIcon.className = 'fa-solid ' + icon;
  statusText.textContent = text;
}

function updateRGBBar(r, g, b) {
  const total = r + g + b || 1;
  const bars = rgbBar.children;
  bars[0].style.flex = r / total;
  bars[1].style.flex = g / total;
  bars[2].style.flex = b / total;
}

// =============================================
//  DEEP SCAN
// =============================================
deepScanBtn.addEventListener('click', () => {
  if (demoMode) {
    triggerDemoDeepScan();
    return;
  }
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send('deepScan');
  } else {
    showToast('Not connected to device', 'error');
  }
});

function openDeepScanModal() {
  const modal = $('deepScanModal');
  $('modalScanning').style.display = 'block';
  $('modalResult').style.display = 'none';
  $('modalProgress').style.width = '0%';
  $('modalProgressText').textContent = '0%';
  modal.classList.add('active');
  deepScanBtn.disabled = true;
}

function updateDeepScanProgress(progress) {
  $('modalProgress').style.width = progress + '%';
  $('modalProgressText').textContent = progress + '%';
}

function showDeepScanResult(data) {
  $('modalScanning').style.display = 'none';
  $('modalResult').style.display = 'block';

  const venom = data.venom || 0;
  const resultVenom = $('modalResultVenom');
  resultVenom.textContent = venom + '%';
  resultVenom.className = 'result-venom ' + (venom > 10 ? 'danger-text' : 'safe-text');

  const icon = $('modalResultIcon');
  if (venom > 10) {
    icon.className = 'fa-solid fa-triangle-exclamation';
    icon.style.color = 'var(--danger)';
  } else {
    icon.className = 'fa-solid fa-check-circle';
    icon.style.color = 'var(--safe)';
  }

  const readings = data.readings || '—';
  $('modalResultMeta').textContent = readings + ' samples averaged | ' + formatTime(new Date());
}

function closeDeepScanModal() {
  $('deepScanModal').classList.remove('active');
  deepScanBtn.disabled = false;
}

// =============================================
//  SCAN HISTORY
// =============================================
function addToHistory(data) {
  const entry = {
    venom: data.venom || 0,
    status: data.status || 'safe',
    isDeepScan: data.isDeepScan || false,
    time: new Date(),
    readings: data.readings || 0
  };
  scanHistory.unshift(entry);
  if (scanHistory.length > 50) scanHistory.pop(); // Keep last 50
  renderHistory();
}

function renderHistory() {
  if (scanHistory.length === 0) {
    emptyHistory.style.display = 'flex';
    // Remove all scan entries but keep empty state
    historyList.querySelectorAll('.scan-entry').forEach(e => e.remove());
    return;
  }
  emptyHistory.style.display = 'none';

  // Clear existing entries
  historyList.querySelectorAll('.scan-entry').forEach(e => e.remove());

  scanHistory.forEach(entry => {
    const el = document.createElement('div');
    el.className = 'scan-entry';

    let iconClass, iconBg, label;
    if (entry.isDeepScan) {
      iconClass = 'fa-microscope'; iconBg = 'deep-icon'; label = 'Deep Scan';
    } else if (entry.status === 'danger') {
      iconClass = 'fa-biohazard'; iconBg = 'danger-icon'; label = 'Danger Detected';
    } else {
      iconClass = 'fa-shield'; iconBg = 'safe-icon'; label = 'Safe Reading';
    }

    const textColor = entry.venom > 10 ? 'danger-text' : 'safe-text';

    el.innerHTML = `
      <div class="entry-icon ${iconBg}"><i class="fa-solid ${iconClass}"></i></div>
      <div class="entry-body">
        <div class="entry-title">${label}</div>
        <div class="entry-sub">${formatTime(entry.time)}${entry.isDeepScan ? ' · ' + entry.readings + ' samples' : ''}</div>
      </div>
      <div class="entry-percent ${textColor}">${entry.venom}%</div>
    `;
    historyList.appendChild(el);
  });
}

$('clearHistoryBtn').addEventListener('click', () => {
  if (scanHistory.length === 0) return;
  scanHistory = [];
  renderHistory();
  showToast('History cleared', 'info');
});

// =============================================
//  DEMO MODE
// =============================================
function toggleDemo() {
  demoMode = !demoMode;
  demoToggle.classList.toggle('active', demoMode);

  if (demoMode) {
    showToast('Demo mode enabled', 'info');
    deepScanBtn.disabled = false;
    updateConnectionUI(false);
    connBadge.className = 'connection-badge connected';
    connBadge.innerHTML = '<i class="fa-solid fa-flask-vial"></i><span>Demo Mode</span>';
    startDemo();
  } else {
    showToast('Demo mode disabled', 'info');
    stopDemo();
    if (!isConnected) {
      deepScanBtn.disabled = true;
      updateConnectionUI(false);
    }
  }
}

function startDemo() {
  stopDemo();
  demoInterval = setInterval(() => {
    const scenarios = ['safe', 'danger_low', 'danger_high', 'no_cartridge'];
    const scenario = scenarios[Math.floor(Math.random() * scenarios.length)];

    let data;
    switch (scenario) {
      case 'safe':
        data = { type: 'scan', venom: Math.floor(Math.random() * 8), status: 'safe',
          hue: 120 + Math.random() * 100, saturation: Math.random() * 0.1,
          raw: { r: 200 + ~~(Math.random()*100), g: 800 + ~~(Math.random()*200), b: 300 + ~~(Math.random()*100), c: 1500 + ~~(Math.random()*500) }};
        break;
      case 'danger_low':
        data = { type: 'scan', venom: 15 + Math.floor(Math.random() * 30), status: 'danger',
          hue: Math.random() * 25, saturation: 0.15 + Math.random() * 0.3,
          raw: { r: 900 + ~~(Math.random()*300), g: 300 + ~~(Math.random()*150), b: 250 + ~~(Math.random()*100), c: 1800 + ~~(Math.random()*400) }};
        break;
      case 'danger_high':
        data = { type: 'scan', venom: 55 + Math.floor(Math.random() * 40), status: 'danger',
          hue: Math.random() * 20, saturation: 0.55 + Math.random() * 0.4,
          raw: { r: 1400 + ~~(Math.random()*400), g: 200 + ~~(Math.random()*100), b: 180 + ~~(Math.random()*80), c: 2200 + ~~(Math.random()*600) }};
        break;
      case 'no_cartridge':
        data = { type: 'scan', venom: 0, status: 'no_cartridge' };
        break;
    }
    handleDeviceData(data);
  }, 800);
}

function stopDemo() {
  if (demoInterval) {
    clearInterval(demoInterval);
    demoInterval = null;
  }
}

function triggerDemoDeepScan() {
  openDeepScanModal();
  let progress = 0;
  const interval = setInterval(() => {
    progress += 5;
    updateDeepScanProgress(Math.min(progress, 100));
    if (progress >= 100) {
      clearInterval(interval);
      const venom = 20 + Math.floor(Math.random() * 70);
      const result = {
        type: 'deepScanResult', venom: venom,
        status: venom > 10 ? 'danger' : 'safe',
        isDeepScan: true, readings: 12 + Math.floor(Math.random() * 8),
        hue: Math.random() * 25, saturation: venom / 100,
        raw: { r: 1000 + ~~(Math.random()*500), g: 300 + ~~(Math.random()*200), b: 250 + ~~(Math.random()*150), c: 2000 + ~~(Math.random()*500) }
      };
      showDeepScanResult(result);
      updateDashboard(result);
      addToHistory(result);
    }
  }, 100);
}

// =============================================
//  TOAST SYSTEM
// =============================================
function showToast(message, type) {
  const container = $('toastContainer');
  const toast = document.createElement('div');
  toast.className = 'toast';

  const icons = { success: 'fa-check-circle', error: 'fa-circle-xmark', info: 'fa-circle-info', warn: 'fa-triangle-exclamation' };

  toast.innerHTML = `
    <i class="fa-solid ${icons[type] || icons.info} toast-icon ${type}"></i>
    <span class="toast-msg">${message}</span>
    <i class="fa-solid fa-xmark toast-close"></i>
  `;

  toast.querySelector('.toast-close').addEventListener('click', () => removeToast(toast));
  container.appendChild(toast);

  setTimeout(() => removeToast(toast), 3500);
}

function removeToast(toast) {
  if (!toast.parentNode) return;
  toast.classList.add('hiding');
  setTimeout(() => toast.remove(), 300);
}

// =============================================
//  UTILITIES
// =============================================
function formatTime(date) {
  const h = date.getHours();
  const m = String(date.getMinutes()).padStart(2, '0');
  const ampm = h >= 12 ? 'pm' : 'am';
  const h12 = h % 12 || 12;
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return h12 + ':' + m + ampm + ' ' + date.getDate() + ' ' + months[date.getMonth()] + ' ' + date.getFullYear();
}
</script>
</body>
